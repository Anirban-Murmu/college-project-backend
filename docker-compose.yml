services:
  backend:
    build: .
    container_name: college_backend
    env_file:
      - .env
    expose:
      - "8005"
    depends_on:
      - postgres
    command: >
      gunicorn config.asgi:application
      -k uvicorn.workers.UvicornWorker
      --workers 3
      --bind 0.0.0.0:8005

  postgres:
    image: postgres:18
    container_name: college_postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql

  nginx:
    image: nginx:alpine
    container_name: college_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data: